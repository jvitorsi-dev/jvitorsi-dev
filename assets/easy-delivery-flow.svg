<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Easy Delivery — diagrama de pedidos, não é captura de tela</title>
  <desc id="desc">Diagrama conceitual das experiências Angular de cliente, restaurante e entregador conectadas à API ASP.NET Core, Mercado Pago e persistência SQL Server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121418"/><stop offset="1" stop-color="#211b17"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#f2d8c2" stroke-opacity=".04"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0v6l7-3z" fill="#ffb56f"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0v6l7-3z" fill="#75cafa"/></marker>
  </defs>
  <rect width="960" height="560" rx="18" fill="url(#bg)"/><rect width="960" height="560" rx="18" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="36" y="48" fill="#ffbd83" font-size="12" letter-spacing="2">02 / EASY DELIVERY</text>
    <text x="36" y="76" fill="#f4ede7" font-size="21" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="600">Um pedido, três experiências conectadas</text>
    <text x="922" y="48" fill="#a68f7d" font-size="10" text-anchor="end" letter-spacing="1">TECHNICAL DIAGRAM · NOT A SCREENSHOT</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g><rect x="38" y="123" width="266" height="112" rx="10" fill="#211d19" stroke="#b87643"/><circle cx="68" cy="153" r="7" fill="#ffb56f"/><text x="88" y="158" fill="#ffd4aa" font-size="13">CLIENTE</text><text x="58" y="191" fill="#dfc6b1" font-size="11">Angular · busca e filtra</text><text x="58" y="211" fill="#dfc6b1" font-size="11">cardápio · carrinho</text></g>
    <g><rect x="347" y="123" width="266" height="112" rx="10" fill="#211d19" stroke="#9c6646"/><circle cx="377" cy="153" r="7" fill="#ffa985"/><text x="397" y="158" fill="#ffd6c6" font-size="13">RESTAURANTE</text><text x="367" y="191" fill="#dfc6b1" font-size="11">consulta pedidos</text><text x="367" y="211" fill="#dfc6b1" font-size="11">avança ou recusa preparo</text></g>
    <g><rect x="656" y="123" width="266" height="112" rx="10" fill="#1a1d22" stroke="#527a94"/><circle cx="686" cy="153" r="7" fill="#75cafa"/><text x="706" y="158" fill="#c5e7f6" font-size="13">ENTREGADOR</text><text x="676" y="191" fill="#c1d2d9" font-size="11">consulta disponíveis</text><text x="676" y="211" fill="#c1d2d9" font-size="11">aceita · conclui entrega</text></g>
    <text x="38" y="272" fill="#b39b83" font-size="10" letter-spacing="1.4">FRONTEND ANGULAR 21 / FLUXO OPERACIONAL</text>
  </g>
  <g fill="none" stroke="#ffb56f" stroke-width="1.6" marker-end="url(#arrow)" opacity=".88"><path d="M171 235v54h190"/><path d="M480 235v54"/></g>
  <g fill="none" stroke="#75cafa" stroke-width="1.6" marker-end="url(#arrowBlue)" opacity=".88"><path d="M789 235v54H600"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="247" y="292" width="466" height="91" rx="11" fill="#1c211f" stroke="#bd8050" stroke-width="1.3"/>
    <text x="480" y="328" text-anchor="middle" fill="#ffcca0" font-size="15">API ASP.NET CORE</text>
    <text x="480" y="353" text-anchor="middle" fill="#c4b6a8" font-size="11">JWT · EF Core · SQL Server</text>
    <text x="38" y="426" fill="#b39b83" font-size="10" letter-spacing="1.4">PAGAMENTO / PERSISTÊNCIA</text>
    <g fill="none" stroke="#ffb56f" stroke-width="1.6" marker-end="url(#arrow)" opacity=".88"><path d="M390 383v36H250v15"/></g>
    <g fill="none" stroke="#75cafa" stroke-width="1.6" marker-end="url(#arrowBlue)" opacity=".88"><path d="M570 383v36h140v15"/></g>
    <g><rect x="100" y="442" width="300" height="62" rx="9" fill="#241d19" stroke="#b87643"/><text x="250" y="468" text-anchor="middle" fill="#ffd0a5" font-size="12">MERCADO PAGO</text><text x="250" y="488" text-anchor="middle" fill="#b9a18d" font-size="10">preferência · webhook de pagamento</text></g>
    <g><rect x="560" y="442" width="300" height="62" rx="9" fill="#192027" stroke="#527a94"/><text x="710" y="468" text-anchor="middle" fill="#c4e6f4" font-size="12">DADOS DO PEDIDO</text><text x="710" y="488" text-anchor="middle" fill="#a1b5bf" font-size="10">EF Core · SQL Server</text></g>
    <text x="38" y="537" fill="#8e8277" font-size="9" letter-spacing="1">DIAGRAMA TÉCNICO CONCEITUAL · NÃO É CAPTURA DA INTERFACE · DEMO HOSPEDADA NÃO LOCALIZADA</text>
  </g>
</svg>
