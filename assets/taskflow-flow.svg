<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">TaskFlow — diagrama técnico conceitual, não é captura de tela</title>
  <desc id="desc">Camadas da API ASP.NET Core, Application, Domain e Infrastructure com EF Core e SQL Server; abaixo, conclusão de tarefa segue por Outbox, RabbitMQ e Worker para criar notificação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1417"/><stop offset="1" stop-color="#102220"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#b8e8db" stroke-opacity=".04"/></pattern>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0v6l7-3z" fill="#65d5e2"/></marker>
  </defs>
  <rect width="960" height="560" rx="18" fill="url(#bg)"/><rect width="960" height="560" rx="18" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="36" y="48" fill="#63dfa9" font-size="12" letter-spacing="2">01 / TASKFLOW</text>
    <text x="36" y="76" fill="#e2f0e9" font-size="21" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="600">API, regras e eventos assíncronos</text>
    <text x="922" y="48" fill="#78958b" font-size="10" text-anchor="end" letter-spacing="1">TECHNICAL DIAGRAM · NOT A SCREENSHOT</text>
    <text x="38" y="111" fill="#77b49a" font-size="10" letter-spacing="1.4">CAMADAS DO REPOSITÓRIO · RESPONSABILIDADES SEPARADAS</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g><rect x="38" y="130" width="146" height="78" rx="9" fill="#12231c" stroke="#3e9c73"/><text x="111" y="162" text-anchor="middle" fill="#b9f2d6" font-size="14">API REST</text><text x="111" y="184" text-anchor="middle" fill="#86ab9b" font-size="10">ASP.NET Core</text></g>
    <g><rect x="220" y="130" width="146" height="78" rx="9" fill="#12231c" stroke="#397e61"/><text x="293" y="162" text-anchor="middle" fill="#d8eee3" font-size="13">Application</text><text x="293" y="184" text-anchor="middle" fill="#86ab9b" font-size="10">casos de uso</text></g>
    <g><rect x="402" y="130" width="146" height="78" rx="9" fill="#12231c" stroke="#397e61"/><text x="475" y="162" text-anchor="middle" fill="#d8eee3" font-size="13">Domain</text><text x="475" y="184" text-anchor="middle" fill="#86ab9b" font-size="10">regras / estados</text></g>
    <g><rect x="584" y="130" width="146" height="78" rx="9" fill="#12231c" stroke="#397e61"/><text x="657" y="162" text-anchor="middle" fill="#d8eee3" font-size="13">Infrastructure</text><text x="657" y="184" text-anchor="middle" fill="#86ab9b" font-size="10">EF Core</text></g>
    <g><rect x="766" y="130" width="156" height="78" rx="9" fill="#122022" stroke="#367d84"/><text x="844" y="162" text-anchor="middle" fill="#c1f0f1" font-size="13">SQL Server</text><text x="844" y="184" text-anchor="middle" fill="#87abb0" font-size="10">persistência</text></g>
    <text x="38" y="269" fill="#70c5a2" font-size="10" letter-spacing="1.4">CONCLUSÃO DE TAREFA → PROCESSAMENTO</text>
  </g>
  <g stroke="#65d5e2" stroke-width="1.6" fill="none" marker-end="url(#arrow2)" opacity=".9"><path d="M184 337h24"/><path d="M366 337h24"/><path d="M548 337h24"/><path d="M730 337h24"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g><rect x="38" y="296" width="146" height="82" rx="9" fill="#101d20" stroke="#367d84"/><text x="111" y="330" text-anchor="middle" fill="#b9eff0" font-size="12">TASK</text><text x="111" y="353" text-anchor="middle" fill="#87abb0" font-size="10">concluída</text></g>
    <g><rect x="220" y="296" width="146" height="82" rx="9" fill="#101d20" stroke="#367d84"/><text x="293" y="330" text-anchor="middle" fill="#c5f1ef" font-size="12">OUTBOX</text><text x="293" y="353" text-anchor="middle" fill="#87abb0" font-size="10">MassTransit / EF</text></g>
    <g><rect x="402" y="296" width="146" height="82" rx="9" fill="#101d20" stroke="#367d84"/><text x="475" y="330" text-anchor="middle" fill="#c5f1ef" font-size="12">RABBITMQ</text><text x="475" y="353" text-anchor="middle" fill="#87abb0" font-size="10">mensageria</text></g>
    <g><rect x="584" y="296" width="146" height="82" rx="9" fill="#12231c" stroke="#3e9c73"/><text x="657" y="330" text-anchor="middle" fill="#b9f2d6" font-size="12">WORKER</text><text x="657" y="353" text-anchor="middle" fill="#86ab9b" font-size="10">consumer</text></g>
    <g><rect x="766" y="296" width="156" height="82" rx="9" fill="#12231c" stroke="#3e9c73"/><text x="844" y="330" text-anchor="middle" fill="#b9f2d6" font-size="12">NOTIFICAÇÃO</text><text x="844" y="353" text-anchor="middle" fill="#86ab9b" font-size="10">processada no Worker</text></g>
    <text x="38" y="438" fill="#80988e" font-size="10" letter-spacing="1.2">CONFIABILIDADE / TESTES</text>
    <rect x="38" y="457" width="884" height="49" rx="8" fill="#0e1918" stroke="#2c5144"/>
    <text x="58" y="487" fill="#c4d8ce" font-size="12">xUnit · NSubstitute · testes por camada · CI com build e testes</text>
    <text x="38" y="537" fill="#6f8980" font-size="9" letter-spacing="1">DIAGRAMA TÉCNICO CONCEITUAL · NÃO É CAPTURA DA INTERFACE</text>
  </g>
</svg>
